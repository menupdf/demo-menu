<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Gestione menu</title>
<style>
  :root{color-scheme:dark;--bg:#000;--panel:#141414;--card:#2b2b2b;--item-border:#3d3d3d;--line:#2a2a2a;--text:#f4f4f4;--muted:#b0b0b0;--accent:#f2a71b;--ink:#1a1a1a;--bad:#ff7a6e;--bad-fg:#2a0805;--input-bg:#0b0b0b;--btn-bg:#1c1c1c;--btn-border:#3a3a3a;--btn-hover:#5a5a5a;--danger-border:#5a2a26;--toast-bg:#ffffff;--toast-fg:#111111}
  :root[data-theme="light"]{color-scheme:light;--bg:#faf8f3;--panel:#ffffff;--card:#efe9dc;--item-border:#d9d0bc;--line:#e3ddd0;--text:#1d2a2c;--muted:#56646a;--accent:#b4570f;--ink:#ffffff;--bad:#b3261e;--bad-fg:#ffffff;--input-bg:#ffffff;--btn-bg:#f1ede3;--btn-border:#cfc7b6;--btn-hover:#a79d88;--danger-border:#e0b4ae;--toast-bg:#1d2a2c;--toast-fg:#ffffff}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 90px}
  h1{font-size:28px;line-height:1.15;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
  h2{font-size:18px;font-weight:800;margin-bottom:4px}
  .muted{color:var(--muted);font-size:15px}
  .center{text-align:center;padding:60px 0}
  .brand{display:flex;gap:14px;align-items:stretch}
  .bar{width:6px;border-radius:3px;background:var(--accent);flex:none}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:18px 0}
  label.field{display:block;margin-top:14px;color:var(--muted);font-size:14px}
  input,select,textarea{display:block;width:100%;margin-top:6px;background:var(--input-bg);border:1px solid var(--btn-border);border-radius:8px;color:var(--text);font:inherit;font-size:16px;padding:11px 12px;min-height:46px}
  textarea{resize:vertical}
  [hidden]{display:none !important}
  input[readonly]{color:var(--muted)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .btn{min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--text);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .btn:hover{border-color:var(--btn-hover)}
  .btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
  .btn.danger{color:var(--bad);border-color:var(--danger-border)}
  .btn.sm{min-height:42px;padding:0 14px}
  .btn.wide{width:100%}
  .btn:disabled{opacity:.3;cursor:default}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

  details.panel{padding:0}
  details.panel > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 18px}
  details.panel > summary::-webkit-details-marker{display:none}
  details.panel > summary:hover .cat-title{color:var(--accent)}
  .cat-title{font-size:18px;font-weight:800;overflow-wrap:anywhere}
  .cat-count{color:var(--muted);font-size:14px;white-space:nowrap}
  .chev{margin-left:auto;flex:none;width:10px;height:10px;margin-right:6px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);transition:transform .15s}
  details[open] > summary .chev{transform:rotate(-135deg)}
  @media (prefers-reduced-motion:reduce){.chev{transition:none}}
  .cat-body{padding:0 18px 18px;border-top:1px solid var(--line)}
  .cat-head{display:grid;grid-template-columns:1fr;gap:0}
  @media (min-width:560px){.cat-head{grid-template-columns:1fr 220px;gap:12px}}
  details.item-card{background:var(--card);border-radius:10px;margin-top:12px;box-shadow:0 0 0 1px var(--item-border)}
  details.item-card.off{opacity:.75}
  details.item-card > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 14px}
  details.item-card > summary::-webkit-details-marker{display:none}
  details.item-card > summary:hover .item-name{color:var(--accent)}
  .sthumb{width:72px;height:54px;flex:none;border-radius:8px;object-fit:cover;background:var(--input-bg);border:1px dashed var(--btn-border)}
  img.sthumb{border:0}
  .item-name{font-size:16px;font-weight:700;overflow-wrap:anywhere}
  .tag-off{display:none;flex:none;font-size:12px;font-weight:700;color:var(--bad);border:1px solid var(--danger-border);border-radius:6px;padding:1px 7px}
  details.item-card.off .tag-off{display:inline-block}
  .item-body{padding:0 16px 16px;border-top:1px solid var(--line)}
  .item-body .photo-row{margin-top:14px}
  .photo-row{display:flex;gap:14px;align-items:center}
  .thumb{width:104px;height:78px;border-radius:8px;object-fit:cover;background:var(--input-bg);border:1px dashed var(--btn-border);flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}
  .photo-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .item-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
  .en-block{margin-top:18px;border-top:1px dashed var(--btn-border)}
  .en-title{margin-top:12px;font-size:14px;font-weight:700;color:var(--accent)}
  .check{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;min-height:46px}
  .check input{width:24px;height:24px;min-height:24px;margin:0;accent-color:var(--accent)}
  .foot-actions{display:flex;gap:8px}

  .err{color:var(--bad);min-height:1.4em;margin-top:12px;font-size:15px}
  .login{max-width:420px;margin:8vh auto 0}
  .login .panel{margin-top:26px}
  .login .btn{width:100%;margin-top:6px}

  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-fg);padding:12px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s;max-width:90vw;z-index:20;text-align:center}
  .toast.show{opacity:1}
  .toast.bad{background:var(--bad);color:var(--bad-fg)}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
  .logo{display:block;width:auto;height:auto;max-height:96px;max-width:60%}
  .logo-top{margin:0 auto 18px}
  .logo-bottom{margin:36px auto 0;max-height:80px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted center">Caricamento…</p></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
const BUCKET = CONFIG.BUCKET || 'menu-images';
const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const state = { user: null, restaurants: [], rest: null, cats: [], open: new Set(), openItems: new Set() };

const LOGOS = { dark: 'logo-tema-scuro.png', light: 'logo-tema-chiaro.png' };
let theme = 'dark';
function applyTheme(t){
  theme = t === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll('img.logo').forEach(i => { i.src = LOGOS[theme]; });
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.content = theme === 'light' ? '#faf8f3' : '#000000';
  try{ localStorage.setItem('menuTheme', theme); }catch{}
}
const logoImg = cls => `<img class="logo ${cls}" alt="CcMenù" src="${LOGOS[theme]}">`;

const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtInput = n => Number(n).toFixed(2).replace('.', ',');
const bySort = (a, b) => a.sort_order - b.sort_order;

let toastTimer;
function toast(msg, bad){
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, bad ? 4500 : 1600);
}

/* ---------- Accesso ---------- */
function renderLogin(){
  app.innerHTML = `<div class="login">
    ${logoImg('logo-top')}
    <div class="brand"><span class="bar"></span>
      <div><h1>Gestione menu</h1><p class="muted">Accedi per modificare il tuo menu.</p></div></div>
    <form class="panel" id="loginForm">
      <label class="field">Email<input type="email" id="email" autocomplete="username" required></label>
      <label class="field">Password<input type="password" id="password" autocomplete="current-password" required></label>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn primary" type="submit">Accedi</button>
    </form>
    ${logoImg('logo-bottom')}</div>`;
  $('loginForm').onsubmit = async e => {
    e.preventDefault();
    $('loginErr').textContent = '';
    const { data, error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    if(error){
      const m = (error.message || '').toLowerCase();
      $('loginErr').textContent =
        m.includes('invalid login') ? 'Email o password non corrette.' :
        m.includes('not confirmed') ? 'Email non ancora confermata. Chiedi a chi gestisce il servizio di confermarla.' :
        'Accesso non riuscito: ' + error.message;
      return;
    }
    state.user = data.user;
    start();
  };
}

function fatal(title, text){
  app.innerHTML = `${logoImg('logo-top')}<div class="center"><h2>${h(title)}</h2><p class="muted">${h(text)}</p>
    <div class="actions" style="justify-content:center"><button class="btn" data-act="logout">Esci</button></div></div>${logoImg('logo-bottom')}`;
}

/* ---------- Caricamento dati ---------- */
async function start(){
  app.innerHTML = '<p class="muted center">Caricamento…</p>';
  const { data, error } = await db.from('restaurant_owners').select('restaurants(*)').eq('user_id', state.user.id);
  if(error) return fatal('Impossibile caricare i dati', error.message);
  const list = data.map(x => x.restaurants).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
  state.restaurants = list;
  if(!list.length) return fatal('Nessun locale collegato a questo account', 'Chiedi a chi gestisce il servizio di collegare il tuo locale.');
  await selectRestaurant(list[0].id);
}

async function selectRestaurant(id){
  state.rest = state.restaurants.find(r => r.id === id);
  const { data, error } = await db.from('categories').select('*, items(*)').eq('restaurant_id', id);
  if(error) return fatal('Impossibile caricare il menu', error.message);
  state.cats = data.sort(bySort).map(c => ({...c, items: (c.items || []).sort(bySort)}));
  state.open = new Set();
  state.openItems = new Set();
  applyTheme(state.rest.theme);
  renderEditor();
}

/* ---------- Interfaccia di modifica ---------- */
function itemHtml(it, c, i, n){
  const photo = c.layout === 'cards' ? `<div class="photo-row">
      ${it.image_url ? `<img class="thumb" src="${h(it.image_url)}" alt="">` : '<div class="thumb">Nessuna foto</div>'}
      <div class="photo-actions">
        <label class="btn sm">${it.image_url ? 'Cambia foto' : 'Carica foto'}<input type="file" accept="image/*" data-photo hidden></label>
        ${it.image_url ? '<button class="btn sm danger" data-act="photo-del">Rimuovi foto</button>' : ''}
      </div></div>` : '';
  const sthumb = c.layout === 'cards'
    ? (it.image_url ? `<img class="sthumb" src="${h(it.image_url)}" alt="">` : '<span class="sthumb"></span>') : '';
  return `<details class="item-card${it.available ? '' : ' off'}" data-item="${it.id}"${state.openItems.has(it.id) ? ' open' : ''}>
    <summary>${sthumb}<span class="item-name">${h(it.name)}</span><span class="tag-off">Esaurito</span><span class="chev" aria-hidden="true"></span></summary>
    <div class="item-body">
    ${photo}
    <label class="field">Nome del piatto<input data-field="name" value="${h(it.name)}" maxlength="80"></label>
    <label class="field">Descrizione<textarea data-field="description" rows="3" maxlength="300">${h(it.description)}</textarea></label>
    <div class="two">
      <label class="field">Prezzo solo piatto (€)<input data-field="price" inputmode="decimal" value="${fmtInput(it.price)}"></label>
      <label class="field">Prezzo menu (€)<input data-field="menu_price" inputmode="decimal" placeholder="vuoto = nessun menu" value="${it.menu_price == null ? '' : fmtInput(it.menu_price)}"></label>
    </div>
    <label class="field">Allergeni<input data-field="allergens" value="${h(it.allergens)}" placeholder="es. glutine, latte" maxlength="120"></label>
    <div class="en-block">
      <p class="en-title">Traduzione in inglese</p>
      <label class="field">Nome del piatto<input data-field="name_en" value="${h(it.name_en)}" maxlength="80"></label>
      <label class="field">Descrizione<textarea data-field="description_en" rows="3" maxlength="300">${h(it.description_en)}</textarea></label>
      <label class="field">Allergeni<input data-field="allergens_en" value="${h(it.allergens_en)}" placeholder="es. gluten, milk" maxlength="120"></label>
    </div>
    <div class="item-foot">
      <label class="check"><input type="checkbox" data-field="available" ${it.available ? 'checked' : ''}> Disponibile</label>
      <div class="foot-actions">
        <button class="btn sm" data-act="item-up" aria-label="Sposta su" ${i === 0 ? 'disabled' : ''}>▲</button>
        <button class="btn sm" data-act="item-down" aria-label="Sposta giù" ${i === n - 1 ? 'disabled' : ''}>▼</button>
        <button class="btn sm danger" data-act="item-del">Elimina</button>
      </div>
    </div>
    </div></details>`;
}

function catHtml(c, ci){
  const n = c.items.length;
  return `<details class="panel" data-cat="${c.id}"${state.open.has(c.id) ? ' open' : ''}>
    <summary><span class="cat-title">${h(c.name)}</span><span class="cat-count">${n}</span><span class="chev" aria-hidden="true"></span></summary>
    <div class="cat-body">
    <div class="cat-head">
      <label class="field">Nome della categoria<input data-cfield="name" value="${h(c.name)}" maxlength="60"></label>
      <label class="field">Aspetto
        <select data-cfield="layout">
          <option value="cards"${c.layout === 'cards' ? ' selected' : ''}>Schede con foto</option>
          <option value="list"${c.layout === 'list' ? ' selected' : ''}>Elenco semplice</option>
        </select></label>
    </div>
    <label class="field">Nome della categoria in inglese<input data-cfield="name_en" value="${h(c.name_en)}" maxlength="60"></label>
    <div class="actions">
      <button class="btn sm" data-act="cat-up" aria-label="Sposta la categoria su" ${ci === 0 ? 'disabled' : ''}>▲</button>
      <button class="btn sm" data-act="cat-down" aria-label="Sposta la categoria giù" ${ci === state.cats.length - 1 ? 'disabled' : ''}>▼</button>
      <button class="btn sm danger" data-act="cat-del">Elimina categoria</button>
    </div>
    ${c.items.map((it, i) => itemHtml(it, c, i, c.items.length)).join('')}
    <div class="actions"><button class="btn primary" data-act="item-add">Aggiungi piatto</button></div>
    </div>
  </details>`;
}

function renderEditor(){
  const r = state.rest;
  const link = new URL('index.html?r=' + encodeURIComponent(r.slug), location.href).href;
  app.innerHTML = `
    ${logoImg('logo-top')}
    <div class="topbar">
      <div class="brand"><span class="bar"></span><div><h1>Gestione menu</h1><p class="muted">${h(state.user.email)}</p></div></div>
      <button class="btn" data-act="logout">Esci</button>
    </div>
    ${state.restaurants.length > 1 ? `<label class="field">Locale
      <select id="restSel">${state.restaurants.map(x => `<option value="${x.id}"${x.id === r.id ? ' selected' : ''}>${h(x.name)}</option>`).join('')}</select></label>` : ''}
    <section class="panel">
      <h2>Dati del locale</h2>
      <label class="field">Nome<input data-rest="name" value="${h(r.name)}" maxlength="80"></label>
      <label class="field">Sottotitolo<input data-rest="tagline" value="${h(r.tagline)}" maxlength="120"></label>
      <label class="field">Sottotitolo in inglese<input data-rest="tagline_en" value="${h(r.tagline_en)}" maxlength="120"></label>
      <label class="field">Tema del menu (colori e logo)
        <select data-rest="theme">
          <option value="dark"${(r.theme || 'dark') === 'dark' ? ' selected' : ''}>Scuro</option>
          <option value="light"${r.theme === 'light' ? ' selected' : ''}>Chiaro</option>
        </select></label>
      <label class="field">Link del menu (da scrivere sulla tessera NFC)<input id="menuLink" readonly value="${h(link)}"></label>
      <div class="actions">
        <button class="btn" data-act="copy-link">Copia link</button>
        <a class="btn" href="${h(link)}" target="_blank" rel="noopener">Apri il menu</a>
      </div>
    </section>
    ${state.cats.map(catHtml).join('')}
    <button class="btn primary wide" data-act="cat-add">Aggiungi categoria</button>
    ${logoImg('logo-bottom')}`;
}

/* ---------- Utilita' ---------- */
function findItem(id){
  for(const c of state.cats){ const it = c.items.find(x => x.id === id); if(it) return { it, c }; }
  return {};
}
const findCat = id => state.cats.find(c => c.id === id);

async function save(table, id, patch){
  const { error } = await db.from(table).update(patch).eq('id', id);
  if(error){ toast('Non salvato: ' + error.message, true); return false; }
  toast('Salvato');
  return true;
}

const photoPath = url => (url && url.includes('/' + BUCKET + '/')) ? decodeURIComponent(url.split('/' + BUCKET + '/')[1]) : null;
async function removeFiles(urls){
  const paths = urls.map(photoPath).filter(Boolean);
  if(paths.length) await db.storage.from(BUCKET).remove(paths);
}

function resizeImage(file, maxW = 1200){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, maxW / img.width);
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s);
      cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? resolve(b) : reject(new Error('immagine non valida')), 'image/jpeg', 0.85);
    };
    img.onerror = () => reject(new Error('immagine non valida'));
    img.src = url;
  });
}

async function reorder(list, i, dir, table){
  const j = i + dir;
  if(j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  const jobs = [];
  list.forEach((x, k) => {
    if(x.sort_order !== k + 1){ x.sort_order = k + 1; jobs.push(db.from(table).update({ sort_order: k + 1 }).eq('id', x.id)); }
  });
  const res = await Promise.all(jobs);
  if(res.some(r => r.error)) toast('Impossibile cambiare l\'ordine', true);
  renderEditor();
}

/* ---------- Salvataggio automatico dei campi ---------- */
async function saveRest(t){
  const f = t.dataset.rest, v = t.value.trim();
  if(f === 'name' && !v){ toast('Il nome del locale non può essere vuoto', true); t.value = state.rest.name; return; }
  if(await save('restaurants', state.rest.id, { [f]: v })){
    state.rest[f] = v;
    if(f === 'theme') applyTheme(v);
  } else if(f === 'theme'){
    t.value = state.rest.theme || 'dark';
  }
}

async function saveCat(t){
  const id = t.closest('[data-cat]').dataset.cat, c = findCat(id), f = t.dataset.cfield, v = t.value.trim();
  if(f === 'name' && !v){ toast('Il nome della categoria non può essere vuoto', true); t.value = c.name; return; }
  if(await save('categories', id, { [f]: v })){
    c[f] = v;
    if(f === 'layout') renderEditor();
    if(f === 'name') t.closest('details').querySelector('.cat-title').textContent = v;
  }
}

async function saveItem(t){
  const id = t.closest('[data-item]').dataset.item, { it } = findItem(id), f = t.dataset.field;
  let v = t.type === 'checkbox' ? t.checked : t.value.trim();
  if(f === 'name' && !v){ toast('Il nome del piatto non può essere vuoto', true); t.value = it.name; return; }
  if(f === 'price' || f === 'menu_price'){
    if(f === 'menu_price' && v === ''){
      v = null;
    } else {
      const n = parseFloat(String(v).replace(',', '.'));
      if(!isFinite(n) || n < 0 || n >= 1e6){ toast('Inserisci un prezzo valido, ad esempio 6,50', true); t.value = it[f] == null ? '' : fmtInput(it[f]); return; }
      v = Math.round(n * 100) / 100;
      t.value = fmtInput(v);
    }
  }
  if(await save('items', id, { [f]: v })){
    it[f] = v;
    if(f === 'name') t.closest('details').querySelector('.item-name').textContent = v;
    if(f === 'available') t.closest('.item-card').classList.toggle('off', !v);
  }
}

async function uploadPhoto(input){
  const file = input.files[0];
  if(!file) return;
  const id = input.closest('[data-item]').dataset.item, { it } = findItem(id);
  toast('Carico la foto…');
  try{
    const blob = await resizeImage(file);
    const path = state.rest.id + '/' + crypto.randomUUID() + '.jpg';
    const up = await db.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
    if(up.error) throw up.error;
    const url = db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    const old = it.image_url;
    if(!(await save('items', id, { image_url: url }))){ await removeFiles([url]); return; }
    it.image_url = url;
    if(old) removeFiles([old]);
    renderEditor();
  }catch(err){
    toast('Foto non caricata: ' + (err.message || err), true);
  }
  input.value = '';
}

/* ---------- Azioni (pulsanti) ---------- */
async function act(name, btn){
  const itemEl = btn.closest('[data-item]'), catEl = btn.closest('[data-cat]');

  if(name === 'logout'){ await db.auth.signOut(); state.user = null; renderLogin(); return; }

  if(name === 'copy-link'){
    const input = $('menuLink');
    try{ await navigator.clipboard.writeText(input.value); toast('Link copiato'); }
    catch{ input.select(); toast('Seleziona e copia il link'); }
    return;
  }

  if(name === 'cat-add'){
    const { data, error } = await db.from('categories').insert({
      restaurant_id: state.rest.id, name: 'Nuova categoria', layout: 'list',
      sort_order: state.cats.length ? Math.max(...state.cats.map(c => c.sort_order)) + 1 : 1
    }).select().single();
    if(error) return toast('Non aggiunta: ' + error.message, true);
    state.cats.push({ ...data, items: [] });
    state.open.add(data.id);
    renderEditor();
    toast('Categoria aggiunta');
    return;
  }

  if(name === 'cat-up' || name === 'cat-down'){
    const i = state.cats.findIndex(c => c.id === catEl.dataset.cat);
    return reorder(state.cats, i, name === 'cat-up' ? -1 : 1, 'categories');
  }

  if(name === 'cat-del'){
    const c = findCat(catEl.dataset.cat);
    if(!confirm('Eliminare la categoria "' + c.name + '" e tutti i suoi piatti?')) return;
    const { error } = await db.from('categories').delete().eq('id', c.id);
    if(error) return toast('Non eliminata: ' + error.message, true);
    removeFiles(c.items.map(x => x.image_url));
    state.cats = state.cats.filter(x => x.id !== c.id);
    renderEditor();
    toast('Categoria eliminata');
    return;
  }

  if(name === 'item-add'){
    const c = findCat(catEl.dataset.cat);
    const { data, error } = await db.from('items').insert({
      restaurant_id: state.rest.id, category_id: c.id, name: 'Nuovo piatto', price: 0,
      sort_order: c.items.length ? Math.max(...c.items.map(x => x.sort_order)) + 1 : 1
    }).select().single();
    if(error) return toast('Non aggiunto: ' + error.message, true);
    c.items.push(data);
    state.openItems.add(data.id);
    renderEditor();
    const el = document.querySelector('[data-item="' + data.id + '"] [data-field="name"]');
    if(el){ el.scrollIntoView({ block: 'center' }); el.focus(); el.select(); }
    return;
  }

  if(name === 'item-up' || name === 'item-down'){
    const { c } = findItem(itemEl.dataset.item);
    const i = c.items.findIndex(x => x.id === itemEl.dataset.item);
    return reorder(c.items, i, name === 'item-up' ? -1 : 1, 'items');
  }

  if(name === 'item-del'){
    const { it, c } = findItem(itemEl.dataset.item);
    if(!confirm('Eliminare "' + it.name + '"?')) return;
    const { error } = await db.from('items').delete().eq('id', it.id);
    if(error) return toast('Non eliminato: ' + error.message, true);
    removeFiles([it.image_url]);
    c.items = c.items.filter(x => x.id !== it.id);
    renderEditor();
    toast('Piatto eliminato');
    return;
  }

  if(name === 'photo-del'){
    const { it } = findItem(itemEl.dataset.item);
    const old = it.image_url;
    if(await save('items', it.id, { image_url: null })){ it.image_url = null; removeFiles([old]); renderEditor(); }
    return;
  }
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(b) act(b.dataset.act, b);
});

app.addEventListener('toggle', e => {
  const d = e.target;
  if(d.tagName !== 'DETAILS') return;
  if(d.dataset.cat){
    if(d.open) state.open.add(d.dataset.cat); else state.open.delete(d.dataset.cat);
  }
  if(d.dataset.item){
    if(d.open) state.openItems.add(d.dataset.item); else state.openItems.delete(d.dataset.item);
  }
}, true);

app.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'restSel') return selectRestaurant(t.value);
  if(t.dataset.rest) return saveRest(t);
  if(t.dataset.cfield) return saveCat(t);
  if(t.dataset.photo !== undefined) return uploadPhoto(t);
  if(t.dataset.field) return saveItem(t);
});

/* ---------- Avvio ---------- */
(async function init(){
  const { data: { session } } = await db.auth.getSession();
  state.user = session ? session.user : null;
  db.auth.onAuthStateChange(ev => { if(ev === 'SIGNED_OUT'){ state.user = null; renderLogin(); } });
  try{ applyTheme(localStorage.getItem('menuTheme')); }catch{ applyTheme('dark'); }
  if(state.user) start(); else renderLogin();
})();
</script>
